name: Big-loss alert

# Wakes the (scale-to-zero) API, asks it to run the Swiss big-loss scan,
# then sends the resulting email from the runner. GitHub cron is UTC-only,
# so each Swiss-time target is scheduled at both its CET and CEST UTC
# equivalent, and the gate job keeps only the one matching the CURRENT DST
# offset. This must be decided
# from the offset, not from wall-clock local time: GitHub routinely delays
# scheduled runs by hours (observed 2-5h delays in practice), which blew
# past a same-day 1-hour local-time gate window and silently skipped the
# real trigger along with the intended DST duplicate — the job still
# showed green because a skipped step isn't a failure.
on:
  schedule:
    # Offset off :00 — GitHub documents the top of the hour as its most
    # congested slot for scheduled workflows, where triggers can be
    # delayed or dropped entirely under load.
    - cron: "7 10 * * 1-5"  # 12:00 Europe/Zurich, CEST (UTC+2)
    - cron: "7 11 * * 1-5"  # 12:00 Europe/Zurich, CET  (UTC+1)
    - cron: "7 14 * * 1-5"  # 16:00 Europe/Zurich, CEST (UTC+2)
    - cron: "7 15 * * 1-5"  # 16:00 Europe/Zurich, CET  (UTC+1)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.gate.outputs.run }}
    steps:
      - name: Gate on current DST offset
        id: gate
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          offset=$(TZ=Europe/Zurich date +%z)  # +0200 CEST, +0100 CET
          sched="${{ github.event.schedule }}"
          echo "Fired schedule: $sched, current Zurich offset: $offset"

          case "$sched" in
            "7 10 * * 1-5"|"7 14 * * 1-5") want="+0200" ;;
            "7 11 * * 1-5"|"7 15 * * 1-5") want="+0100" ;;
            *) want="" ;;
          esac

          if [ "$offset" = "$want" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

  send:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    # Only on this job, so a gated-out DST duplicate never enters the group:
    # a newly queued run displaces the group's pending one.
    concurrency:
      group: big-loss-alert
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/send_big_loss_alert.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run scan + send email
        timeout-minutes: 25
        env:
          API_KEY: ${{ secrets.RAG_API_KEY }}
          API_BASE_URL: ${{ secrets.RAG_API_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python3 scripts/send_big_loss_alert.py
