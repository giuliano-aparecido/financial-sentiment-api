name: Big-loss alert

# Wakes the (scale-to-zero) API and asks it to run the Swiss big-loss scan
# and email the result. Triggered only by workflow_dispatch from an
# external scheduler (cron-job.org, Europe/Zurich) — see README. Don't add
# a `schedule:` trigger back: GitHub ran it hours late in this repo.
on:
  workflow_dispatch:

permissions: {}

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger scan + email
        env:
          API_KEY: ${{ secrets.RAG_API_KEY }}
          API_BASE_URL: ${{ secrets.RAG_API_URL }}
        run: |
          curl --silent --show-error --fail-with-body \
            --retry 4 --retry-delay 30 --retry-all-errors --max-time 120 \
            -X POST \
            -H "X-API-Key: $API_KEY" \
            "$API_BASE_URL/api/research/volatility/today/alert"
