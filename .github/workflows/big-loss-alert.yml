name: Big-loss alert

# Wakes the (scale-to-zero) API and asks it to run the Swiss big-loss scan
# and email the result. Triggered only by workflow_dispatch from an
# external scheduler (cron-job.org, Europe/Zurich) — see README. Don't add
# a `schedule:` trigger back: GitHub ran it hours late in this repo.
on:
  workflow_dispatch:

permissions:
  contents: read

# A second dispatch while one is in flight would join the same scan and
# send a duplicate email.
concurrency:
  group: big-loss-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/send_big_loss_alert.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Run scan + send email
        timeout-minutes: 25
        env:
          API_KEY: ${{ secrets.RAG_API_KEY }}
          API_BASE_URL: ${{ secrets.RAG_API_URL }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          ALERT_EMAIL_FROM: ${{ secrets.ALERT_EMAIL_FROM }}
          ALERT_EMAIL_TO: ${{ secrets.ALERT_EMAIL_TO }}
        run: python3 scripts/send_big_loss_alert.py
