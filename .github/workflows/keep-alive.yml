name: Keep Render service warm

# Render's free tier spins the service down after ~15 minutes with no
# incoming requests - a cold start then takes 30-60s AND wipes the
# research-scan's in-memory job/cache state (app/services/research_job.py
# has no persistence beyond process memory, by design). Pinging /health
# every 10 minutes keeps a comfortable margin under that 15-minute
# threshold so the service - and that cache - stays warm all day.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS https://financial-sentiment-api-qs45.onrender.com/health
